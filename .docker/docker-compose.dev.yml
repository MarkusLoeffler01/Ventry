name: ventry-dev

services:
  ventry:
    image: harbor.m-loeffler.de/ventry/app:dev-foss
    container_name: ventry-dev
    restart: unless-stopped
    env_file:
      - .dev.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5001:3000"

  redis:
    image: redis:7-alpine
    container_name: ventry-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ventry-redis-dev-data:/data

volumes:
  ventry-redis-dev-data:
