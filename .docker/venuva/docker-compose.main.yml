name: venuva

services:
  ventry:
    image: harbor.m-loeffler.de/ventry/app:main-venuva
    container_name: venuva
    restart: unless-stopped
    env_file:
      - .prod.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      caddy-public:
        aliases:
          - venuva

  redis:
    image: redis:7-alpine
    container_name: venuva-redis-main
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - venuva-redis-main-data:/data

volumes:
  venuva-redis-main-data:

networks:
  caddy-public:
    external: true
    name: caddy-public
