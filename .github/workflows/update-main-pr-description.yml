name: Update main release PR description

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  update:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && contains(github.event.comment.body, '<!-- ventry:release-controls -->'))
    runs-on: ubuntu-latest
    steps:
      - name: Read PR context
        id: pr-context
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request
              || (await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              })).data;

            const shouldRun = pullRequest.base.ref === "main"
              && pullRequest.head.ref === "dev"
              && pullRequest.head.repo.full_name === context.payload.repository.full_name;

            core.setOutput("should_run", shouldRun ? "true" : "false");
            core.setOutput("pr_number", String(pullRequest.number));
            core.setOutput("head_ref", pullRequest.head.ref);
            core.setOutput("body", pullRequest.body || "");

      - uses: actions/checkout@v4
        if: steps.pr-context.outputs.should_run == 'true'
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-context.outputs.head_ref }}

      - name: Fetch release branches
        if: steps.pr-context.outputs.should_run == 'true'
        run: git fetch origin main dev --tags --prune

      - name: Generate calculated release preview
        if: steps.pr-context.outputs.should_run == 'true'
        id: calculated-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_RANGE: origin/main..origin/dev
          RELEASE_NOTES_FILE: release-notes-calculated.md
        run: node .github/scripts/generate-release-notes.mjs

      - name: Read release controls
        if: steps.pr-context.outputs.should_run == 'true'
        id: release-controls
        uses: actions/github-script@v7
        env:
          CALCULATED_VERSION: ${{ steps.calculated-release.outputs.version }}
        with:
          script: |
            const marker = "<!-- ventry:release-controls -->";
            const prNumber = Number("${{ steps.pr-context.outputs.pr_number }}");
            const calculatedVersion = process.env.CALCULATED_VERSION;
            const allowedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const trustedBotLogins = new Set(
              (process.env.TRUSTED_RELEASE_CONTROL_BOTS || "github-actions[bot]")
                .split(",")
                .map((login) => login.trim())
                .filter(Boolean)
            );

            function isTrustedControlComment(comment) {
              return comment.body?.includes(marker)
                && (
                  allowedAssociations.has(comment.author_association)
                  || trustedBotLogins.has(comment.user?.login)
                );
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const controlComments = comments
              .filter(isTrustedControlComment)
              .sort((left, right) => new Date(right.updated_at) - new Date(left.updated_at));

            function parseControlComment(body = "") {
              const enabled = /-\s*\[[xX]\]\s*(?:override\s+)?release\s+version/i.test(body);
              const version = body.match(/(?:release\s+version|version)\s*:\s*v?(\d+\.\d+\.\d+)/i)?.[1] || calculatedVersion;
              return { enabled, version };
            }

            const latestControl = controlComments[0]
              ? parseControlComment(controlComments[0].body)
              : { enabled: false, version: calculatedVersion };
            const overrideText = latestControl.enabled && latestControl.version
              ? `Release version override: ${latestControl.version}`
              : "";
            const effectiveVersion = latestControl.enabled ? latestControl.version : calculatedVersion;

            const controlBody = [
              marker,
              "## Release controls",
              "",
              "Edit this comment to override the automatic release version. If GitHub does not let you edit this bot comment, add a new comment containing this same marker block.",
              "",
              `${latestControl.enabled ? "- [x]" : "- [ ]"} Override release version`,
              `Release version: ${latestControl.version}`,
              "",
              `Calculated version: \`${calculatedVersion}\``,
              `Effective version: \`${effectiveVersion}\``,
              overrideText
                ? "Status: override enabled"
                : "Status: automatic versioning",
            ].join("\n");

            const botComment = comments.find((comment) =>
              trustedBotLogins.has(comment.user?.login) && comment.body?.includes(marker)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: controlBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: controlBody,
              });
            }

            core.setOutput("override_text", overrideText);

      - name: Generate semantic release notes
        if: steps.pr-context.outputs.should_run == 'true'
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_RANGE: origin/main..origin/dev
          RELEASE_NOTES_FILE: release-notes.md
          RELEASE_VERSION_OVERRIDE_TEXT: ${{ steps.release-controls.outputs.override_text }}
        run: node .github/scripts/generate-release-notes.mjs

      - name: Update PR description
        if: steps.pr-context.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require("node:fs");

            const prNumber = Number("${{ steps.pr-context.outputs.pr_number }}");
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const startMarker = "<!-- ventry:release-description:start -->";
            const endMarker = "<!-- ventry:release-description:end -->";
            const generated = [
              startMarker,
              readFileSync("release-notes.md", "utf8").trim(),
              endMarker,
            ].join("\n");
            const body = pr.body || "";
            const markedRegex = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`, "m");
            const nextBody = markedRegex.test(body)
              ? body.replace(markedRegex, generated)
              : `${generated}\n\n${body.trim()}`.trim();

            if (nextBody === body) {
              core.info("Release PR description is already up to date.");
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: nextBody,
            });

            core.info(`Updated release PR #${prNumber}.`);
