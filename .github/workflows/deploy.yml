name: Build and Deploy

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - main

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  IMAGE_NAME: ventry/app
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: /docker/ventry

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Resolve build metadata
        id: build_metadata
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null || node -p "'v' + JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment target
        id: target
        env:
          DEV_BETTER_AUTH_URL: ${{ secrets.DEV_BETTER_AUTH_URL }}
          MAIN_BETTER_AUTH_URL: ${{ secrets.MAIN_BETTER_AUTH_URL }}
          DEV_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.DEV_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          MAIN_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.MAIN_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          MAIN_DATABASE_URL: ${{ secrets.MAIN_DATABASE_URL }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DEPLOY_TARGET="${{ github.event.inputs.target }}"
          else
            DEPLOY_TARGET="${GITHUB_REF_NAME}"
          fi

          case "${DEPLOY_TARGET}" in
            dev)
              echo "tag=dev" >> "$GITHUB_OUTPUT"
              echo "compose_file=docker-compose.dev.yml" >> "$GITHUB_OUTPUT"
              echo "better_auth_url=${DEV_BETTER_AUTH_URL:-https://dev-ventry.m-loeffler.de}" >> "$GITHUB_OUTPUT"
              echo "stripe_publishable_key=${DEV_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" >> "$GITHUB_OUTPUT"
              echo "health_url=https://dev-ventry.m-loeffler.de/api/health" >> "$GITHUB_OUTPUT"
              echo "database_url=${DEV_DATABASE_URL}" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "tag=main" >> "$GITHUB_OUTPUT"
              echo "compose_file=docker-compose.main.yml" >> "$GITHUB_OUTPUT"
              echo "better_auth_url=${MAIN_BETTER_AUTH_URL:-https://ventry.m-loeffler.de}" >> "$GITHUB_OUTPUT"
              echo "stripe_publishable_key=${MAIN_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" >> "$GITHUB_OUTPUT"
              echo "health_url=https://ventry.m-loeffler.de/api/health" >> "$GITHUB_OUTPUT"
              echo "database_url=${MAIN_DATABASE_URL}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deployment target: ${DEPLOY_TARGET}" >&2
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.target.outputs.tag }}
          build-args: |
            BETTER_AUTH_URL=${{ steps.target.outputs.better_auth_url }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ steps.target.outputs.stripe_publishable_key }}
            NEXT_PUBLIC_GIT_COMMIT=${{ steps.build_metadata.outputs.commit }}
            NEXT_PUBLIC_GIT_TAG=${{ steps.build_metadata.outputs.tag }}
            NEXT_PUBLIC_BUILD_DATE=${{ steps.build_metadata.outputs.build_date }}

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ steps.target.outputs.database_url }}
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          npx prisma migrate deploy

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Sync compose file to server
        run: |
          scp ".docker/${{ steps.target.outputs.compose_file }}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/${{ steps.target.outputs.compose_file }}"

      - name: Deploy on server
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && \
             docker compose -f '${{ steps.target.outputs.compose_file }}' pull && \
             docker compose -f '${{ steps.target.outputs.compose_file }}' up -d"

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "${{ steps.target.outputs.health_url }}" >/dev/null; then
              exit 0
            fi

            sleep 10
          done

          echo "Deployment health check failed for ${{ steps.target.outputs.health_url }}" >&2
          exit 1
