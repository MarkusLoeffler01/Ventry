name: Build and Deploy

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - main

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  IMAGE_NAME: ventry/app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        server: [foss, venuva]
    concurrency:
      group: deploy-${{ matrix.server }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Resolve deployment target
        id: target
        env:
          INPUT_TARGET: ${{ github.event.inputs.target }}
          SERVER: ${{ matrix.server }}
          DEV_BETTER_AUTH_URL: ${{ secrets.DEV_BETTER_AUTH_URL }}
          MAIN_BETTER_AUTH_URL: ${{ secrets.MAIN_BETTER_AUTH_URL }}
          DEV_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.DEV_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          MAIN_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.MAIN_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          MAIN_DATABASE_URL: ${{ secrets.MAIN_DATABASE_URL }}
          VENUVA_DEV_BETTER_AUTH_URL: ${{ secrets.VENUVA_DEV_BETTER_AUTH_URL }}
          VENUVA_MAIN_BETTER_AUTH_URL: ${{ secrets.VENUVA_MAIN_BETTER_AUTH_URL }}
          VENUVA_DEV_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VENUVA_DEV_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          VENUVA_MAIN_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VENUVA_MAIN_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          VENUVA_DEV_DATABASE_URL: ${{ secrets.VENUVA_DEV_DATABASE_URL }}
          VENUVA_MAIN_DATABASE_URL: ${{ secrets.VENUVA_MAIN_DATABASE_URL }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DEPLOY_TARGET="${INPUT_TARGET}"
          else
            DEPLOY_TARGET="${GITHUB_REF_NAME}"
          fi

          case "${DEPLOY_TARGET}-${SERVER}" in
            dev-foss)
              echo "branch=dev" >> "$GITHUB_OUTPUT"
              echo "image_tag=dev-foss" >> "$GITHUB_OUTPUT"
              echo "compose_source=.docker/docker-compose.dev.yml" >> "$GITHUB_OUTPUT"
              echo "compose_filename=docker-compose.dev.yml" >> "$GITHUB_OUTPUT"
              echo "better_auth_url=${DEV_BETTER_AUTH_URL:-https://dev-ventry.m-loeffler.de}" >> "$GITHUB_OUTPUT"
              echo "stripe_publishable_key=${DEV_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" >> "$GITHUB_OUTPUT"
              echo "health_url=https://dev-ventry.m-loeffler.de/api/health" >> "$GITHUB_OUTPUT"
              echo "database_url=${DEV_DATABASE_URL}" >> "$GITHUB_OUTPUT"
              echo "deploy_path=/docker/ventry" >> "$GITHUB_OUTPUT"
              ;;
            main-foss)
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "image_tag=main-foss" >> "$GITHUB_OUTPUT"
              echo "compose_source=.docker/docker-compose.main.yml" >> "$GITHUB_OUTPUT"
              echo "compose_filename=docker-compose.main.yml" >> "$GITHUB_OUTPUT"
              echo "better_auth_url=${MAIN_BETTER_AUTH_URL:-https://ventry.m-loeffler.de}" >> "$GITHUB_OUTPUT"
              echo "stripe_publishable_key=${MAIN_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" >> "$GITHUB_OUTPUT"
              echo "health_url=https://ventry.m-loeffler.de/api/health" >> "$GITHUB_OUTPUT"
              echo "database_url=${MAIN_DATABASE_URL}" >> "$GITHUB_OUTPUT"
              echo "deploy_path=/docker/ventry" >> "$GITHUB_OUTPUT"
              ;;
            dev-venuva)
              echo "branch=dev" >> "$GITHUB_OUTPUT"
              echo "image_tag=dev-venuva" >> "$GITHUB_OUTPUT"
              echo "compose_source=.docker/venuva/docker-compose.dev.yml" >> "$GITHUB_OUTPUT"
              echo "compose_filename=docker-compose.dev.yml" >> "$GITHUB_OUTPUT"
              echo "better_auth_url=${VENUVA_DEV_BETTER_AUTH_URL:-https://dev.venuva.dog}" >> "$GITHUB_OUTPUT"
              echo "stripe_publishable_key=${VENUVA_DEV_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" >> "$GITHUB_OUTPUT"
              echo "health_url=https://dev.venuva.dog/api/health" >> "$GITHUB_OUTPUT"
              echo "database_url=${VENUVA_DEV_DATABASE_URL}" >> "$GITHUB_OUTPUT"
              echo "deploy_path=/docker/venuva" >> "$GITHUB_OUTPUT"
              ;;
            main-venuva)
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "image_tag=main-venuva" >> "$GITHUB_OUTPUT"
              echo "compose_source=.docker/venuva/docker-compose.main.yml" >> "$GITHUB_OUTPUT"
              echo "compose_filename=docker-compose.main.yml" >> "$GITHUB_OUTPUT"
              echo "better_auth_url=${VENUVA_MAIN_BETTER_AUTH_URL:-https://venuva.dog}" >> "$GITHUB_OUTPUT"
              echo "stripe_publishable_key=${VENUVA_MAIN_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" >> "$GITHUB_OUTPUT"
              echo "health_url=https://venuva.dog/api/health" >> "$GITHUB_OUTPUT"
              echo "database_url=${VENUVA_MAIN_DATABASE_URL}" >> "$GITHUB_OUTPUT"
              echo "deploy_path=/docker/venuva" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deployment target: ${DEPLOY_TARGET}-${SERVER}" >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}

      - name: Resolve build metadata
        id: build_metadata
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null || node -p "'v' + JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.target.outputs.image_tag }}
          build-args: |
            BETTER_AUTH_URL=${{ steps.target.outputs.better_auth_url }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ steps.target.outputs.stripe_publishable_key }}
            NEXT_PUBLIC_GIT_COMMIT=${{ steps.build_metadata.outputs.commit }}
            NEXT_PUBLIC_GIT_TAG=${{ steps.build_metadata.outputs.tag }}
            NEXT_PUBLIC_BUILD_DATE=${{ steps.build_metadata.outputs.build_date }}

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ steps.target.outputs.database_url }}
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          npx prisma migrate deploy

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ matrix.server == 'foss' && secrets.DEPLOY_HOST || secrets.VENUVA_DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ matrix.server == 'foss' && secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.VENUVA_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Sync compose file to server
        env:
          DEPLOY_HOST: ${{ matrix.server == 'foss' && secrets.DEPLOY_HOST || secrets.VENUVA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ matrix.server == 'foss' && secrets.DEPLOY_USER || secrets.VENUVA_DEPLOY_USER }}
        run: |
          scp "${{ steps.target.outputs.compose_source }}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${{ steps.target.outputs.deploy_path }}/${{ steps.target.outputs.compose_filename }}"

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ matrix.server == 'foss' && secrets.DEPLOY_HOST || secrets.VENUVA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ matrix.server == 'foss' && secrets.DEPLOY_USER || secrets.VENUVA_DEPLOY_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${{ steps.target.outputs.deploy_path }}' && \
             docker compose -f '${{ steps.target.outputs.compose_filename }}' pull && \
             docker compose -f '${{ steps.target.outputs.compose_filename }}' up -d"

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "${{ steps.target.outputs.health_url }}" >/dev/null; then
              exit 0
            fi

            sleep 10
          done

          echo "Deployment health check failed for ${{ steps.target.outputs.health_url }}" >&2
          exit 1
