name: Add issues to project
on:
  issues:
    types: [opened, labeled]
permissions:
  issues: write
  repository-projects: write
  contents: read
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Create board management token
        id: board-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.VENTRY_BOARD_APP_ID || '3959877' }}
          private-key: ${{ secrets.VENTRY_BOARD_APP_PRIVATE_KEY }}
          owner: MarkusLoeffler01

      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/MarkusLoeffler01/projects/4
          github-token: ${{ steps.board-token.outputs.token }}
